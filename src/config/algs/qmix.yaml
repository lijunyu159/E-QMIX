# --- QMIX specific parameters ---

# use epsilon greedy action selector
action_selector: "epsilon_greedy"
epsilon_start: 1.0
epsilon_finish: 0.05
epsilon_anneal_time: 100000 # 500000 for 6h_vs_8z

runner: "parallel" # "episode", "parallel", "parallel_curricula", "episode_eval"
batch_size_run: 8 #8 batch_size_run=4, buffer_size = 2500, batch_size=64  for 3s5z_vs_3s6z
buffer_size: 5000
batch_size: 128

t_max: 2000000 # 2000000

# update the target network every {} episodes
target_update_interval: 200

# use the Q_Learner to train
mac: "n_mac"
agent: "n_rnn"
agent_output_type: q

learner: "nq_learner_lr_decay"
mixer: "qmix"
mixing_embed_dim: 32
hypernet_embed: 64
lr: 0.001  # Learning rate for agents
td_lambda: 0.6 # 0.3 for 6h_vs_8z
optimizer: 'adam'
q_lambda: True
gamma_lr: 0.997 # 0.95, 0.98, 0.999

name: "qmix_env=8_adam_td_lambda"

# vae training
vae_train_interval: 2
vae_train_iters: 1

# 内在奖励系数
stat_coef: 0.01
dyna_coef: 0.0002

use_rnd_explore: True

rnd_lr: 0.0005
pretext:
  num_steps: 96
  batch_size: 1
  cvae_decoder: 'lstm'
  lr: 5e-4
  epoch_num: 1
network:
  rnn_hidden_size: 256
  embedding_size: 64
env_config:
  ob_space:
    latent_size: 2
